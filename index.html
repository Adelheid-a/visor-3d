<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>3D Pro Viewer</title>

  <style>
    body { margin: 0; overflow: hidden; background: #0b0b0b; }

    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      color: white;
      font-family: Arial;
    }

    button {
      background: #1f1f1f;
      color: white;
      border: 1px solid #333;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 6px;
    }

    button:hover {
      background: #333;
    }

    #drop {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-family: Arial;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="ui">
  <button onclick="toggleFullscreen()">Fullscreen</button>
</div>

<div id="drop">Arrastra un .glb aquí</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/RGBELoader.js"></script>

<script>
let scene = new THREE.Scene();

let camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(2, 1.5, 3);

let renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// CONTROLES
let controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// HDR ENVIRONMENT (LUZ PRO)
const pmrem = new THREE.PMREMGenerator(renderer);
new THREE.RGBELoader()
  .setPath('https://threejs.org/examples/textures/equirectangular/')
  .load('royal_esplanade_1k.hdr', function (hdr) {
    const envMap = pmrem.fromEquirectangular(hdr).texture;
    scene.environment = envMap;
    scene.background = new THREE.Color(0x0b0b0b);
    hdr.dispose();
    pmrem.dispose();
  });

// PISO CON REFLEJO
let floorGeo = new THREE.PlaneGeometry(20, 20);
let floorMat = new THREE.MeshStandardMaterial({
  color: 0x111111,
  metalness: 0.3,
  roughness: 0.6
});
let floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1;
floor.receiveShadow = true;
scene.add(floor);

// LUZ EXTRA SUAVE
let light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
scene.add(light);

let model;
let loader = new THREE.GLTFLoader();

// CARGA MODELO URL
const params = new URLSearchParams(window.location.search);
let modelURL = params.get('model');

if (!modelURL) {
  modelURL = "https://modelviewer.dev/shared-assets/models/Astronaut.glb";
}

loadModel(modelURL);

function loadModel(url){
  if(model) scene.remove(model);

  loader.load(url, function(gltf){
    model = gltf.scene;
    scene.add(model);

    // centrar
    let box = new THREE.Box3().setFromObject(model);
    let center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);

  });
}

// FULLSCREEN
function toggleFullscreen(){
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

// DRAG & DROP
window.addEventListener('dragover', e => {
  e.preventDefault();
});

window.addEventListener('drop', e => {
  e.preventDefault();
  let file = e.dataTransfer.files[0];

  if(file && file.name.endsWith('.glb')){
    let url = URL.createObjectURL(file);
    loadModel(url);
  }
});

// RESIZE
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ANIMACIÓN
function animate(){
  requestAnimationFrame(animate);

  controls.update();

  if(model){
    model.rotation.y += 0.002;
  }

  renderer.render(scene, camera);
}

animate();
</script>

</body>
</html>
